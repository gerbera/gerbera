name: Minimal

on:
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  APK_TOOLS_URL: https://gitlab.alpinelinux.org/api/v4/projects/5/packages/generic/v2.14.10/x86_64/apk.static
  APK_TOOLS_SHA256: 34bb1a96f0258982377a289392d4ea9f3f4b767a4bb5806b1b87179b79ad8a1c
  APK_TOOLS_CDN_URL: https://dl-cdn.alpinelinux.org/alpine/v3.22/main/x86_64/apk-tools-static-2.14.12-r0.apk
  APK_TOOLS_CDN_PACKAGE_SHA256: f44523ae4ded143b3d85e16be4bf7ff386fc052406c3b22f87f045efb0aa4305
  APK_TOOLS_CDN_SHA256: 034d28bbf3d97d90fd76e572ab8ae74a038da0e7593e9d412eabccf69ccd3553

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: ['x86_64', 'x86', 'armhf', 'armv7', 'aarch64', 'loongarch64', 'ppc64le', 'riscv64', 's390x']
        branch: ['v3.23', 'v3.24', 'edge']
        exclude:
          - platform: "ppc64le"
            branch: "v3.24"

    name: Minimal ${{matrix.platform}}${{matrix.branch != 'v3.24' && format(' - {0}', matrix.branch) || ''}}
    defaults:
      run:
        shell: alpine.sh {0}
    steps:
      - uses: actions/checkout@v7
      - name: Download and verify static apk-tools
        id: apk-tools
        shell: bash
        timeout-minutes: 6
        run: |
          # setup-alpine verifies and reuses this file instead of downloading it again.
          apk_download="$RUNNER_TEMP/apk.download"
          apk_extracted="$RUNNER_TEMP/apk.extracted"
          trap 'rm -f -- "$apk_download" "$apk_extracted"' EXIT
          download() {
            curl --ipv4 --fail --show-error --location \
              --connect-timeout 10 --max-time 30 \
              --retry 2 --retry-delay 5 --retry-max-time 60 --retry-connrefused \
              --output "$apk_download" "$1"
          }
          apk_sha256="$APK_TOOLS_SHA256"
          if download "$APK_TOOLS_CDN_URL"; then
            printf '%s  %s\n' "$APK_TOOLS_CDN_PACKAGE_SHA256" "$apk_download" | sha256sum --check --strict
            tar --ignore-zeros -xzOf "$apk_download" sbin/apk.static > "$apk_extracted"
            mv -- "$apk_extracted" "$apk_download"
            apk_sha256="$APK_TOOLS_CDN_SHA256"
          else
            echo '::warning::Alpine CDN download failed; using the pinned Alpine GitLab binary.'
            download "$APK_TOOLS_URL"
          fi
          printf '%s  %s\n' "$apk_sha256" "$apk_download" | sha256sum --check --strict
          mv -- "$apk_download" "$RUNNER_TEMP/apk"
          # setup-alpine must reuse the preloaded binary with the selected hash.
          printf 'sha256=%s\n' "$apk_sha256" >> "$GITHUB_OUTPUT"
      - name: Test Alpine mirror selection
        if: matrix.platform == 'x86' && matrix.branch == 'edge'
        shell: bash
        timeout-minutes: 2
        run: python3 .github/scripts/test_select_alpine_mirror.py
      - name: Select Alpine package mirror
        id: alpine-mirror
        shell: bash
        timeout-minutes: 8
        env:
          ALPINE_BRANCH: ${{ matrix.branch }}
          ALPINE_ARCH: ${{ matrix.platform }}
        run: bash .github/scripts/select-alpine-mirror.sh "$ALPINE_BRANCH" "$ALPINE_ARCH" >> "$GITHUB_OUTPUT"
      - uses: jirutka/setup-alpine@v1
        with:
          mirror-url: ${{ steps.alpine-mirror.outputs.mirror-url }}
          extra-repositories: ${{ steps.alpine-mirror.outputs.extra-repositories }}
          apk-tools-url: '${{ env.APK_TOOLS_URL }}#!sha256!${{ steps.apk-tools.outputs.sha256 }}'
          branch: ${{matrix.branch}}
          arch: ${{matrix.platform}}
          packages: >
            build-base
            cmake
            duktape-dev
            fmt-dev
            git
            gtest-dev
            libupnp-dev
            ninja
            pkgconf
            pugixml-dev
            jsoncpp-dev
            spdlog-dev
            sqlite-dev
            icu-dev
            util-linux-dev
            zlib-dev

      - name: Build
        run: |
          cmake -S . -B build -G Ninja --preset=minimal
          cmake --build build -j$(nproc) --verbose

      - name: Test
        run: |
          cd build
          ctest --output-on-failure
