name: docker

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    outputs:
      debug-tags: ${{ steps.docker_meta_debug.outputs.tags }}
      debug-labels: ${{ steps.docker_meta_debug.outputs.labels }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # We need history/tags to generate version info

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: gerbera/gerbera
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=edge

      - name: Docker meta (transcoding)
        id: docker_meta_transcoding
        uses: docker/metadata-action@v6
        with:
          images: gerbera/gerbera
          flavor: |
            suffix=-transcoding
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=edge

      - name: Docker meta (debug)
        id: docker_meta_debug
        uses: docker/metadata-action@v6
        with:
          images: gerbera/gerbera
          flavor: |
            suffix=-debug
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=edge

      - name: Set up QEMU
        if: "${{ github.repository == 'gerbera/gerbera' && ( startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' ) }}"
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: "${{ github.repository == 'gerbera/gerbera' && ( startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' ) }}"
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

        # https://docs.docker.com/build/ci/github-actions/test-before-push/
      - name: Build and export
        if: ${{github.event_name == 'pull_request'}}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ steps.docker_meta.outputs.tags }}-test
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Test
        if: ${{github.event_name == 'pull_request'}}
        run: |
          docker run --user gerbera:gerbera --rm ${{ steps.docker_meta.outputs.tags }}-test gerbera --compile-info

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: "linux/amd64${{ ( startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' ) && ',linux/arm/v7,linux/arm64' || '' }}"
          push: ${{ github.repository == 'gerbera/gerbera' && ( startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' ) }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Build and push (transcoding)
        if: "${{ github.repository == 'gerbera/gerbera' && ( startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' ) }}"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: ${{ github.repository == 'gerbera/gerbera' && ( startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' ) }}
          tags: ${{ steps.docker_meta_transcoding.outputs.tags }}
          labels: ${{ steps.docker_meta_transcoding.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          target: with_transcoding

      - # Temp fix
        # https://github.com/docker/build-push-action/issues/252
        # https://github.com/moby/buildkit/issues/1896
        name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Docker Hub Description
        if: "${{ github.repository == 'gerbera/gerbera' && ( startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' ) }}"
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: gerbera/gerbera
          readme-filepath: README.Docker.md

  debug:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      PUBLISH_DEBUG: ${{ github.repository == 'gerbera/gerbera' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # We need history/tags to generate version info

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: env.PUBLISH_DEBUG == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-dbg
          key: ${{ runner.os }}-buildx-debug-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-debug-${{ matrix.arch }}-

      - name: Build and test (debug)
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.debug
          platforms: linux/${{ matrix.arch }}
          outputs: ${{ env.PUBLISH_DEBUG == 'true' && 'type=image,name=gerbera/gerbera,push-by-digest=true,name-canonical=true,push=true' || 'type=docker' }}
          tags: ${{ env.PUBLISH_DEBUG != 'true' && 'gerbera-debug:test' || '' }}
          labels: ${{ needs.build.outputs.debug-labels }}
          cache-from: type=local,src=/tmp/.buildx-dbg
          cache-to: type=local,dest=/tmp/.buildx-cache-dbg,mode=max
          target: debug

      - name: Check the debug image
        if: env.PUBLISH_DEBUG != 'true'
        run: docker run --user gerbera:gerbera --rm gerbera-debug:test gerbera --compile-info

      - name: Record the debug image digest
        if: env.PUBLISH_DEBUG == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s\n' "$DIGEST" > debug-${{ matrix.arch }}.digest

      - name: Upload the debug image digest
        if: env.PUBLISH_DEBUG == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: debug-digest-${{ matrix.arch }}
          path: debug-${{ matrix.arch }}.digest
          if-no-files-found: error
          overwrite: true

      - # Temp fix
        # https://github.com/docker/build-push-action/issues/252
        # https://github.com/moby/buildkit/issues/1896
        name: Move cache
        run: |
          rm -rf /tmp/.buildx-dbg
          mv /tmp/.buildx-cache-dbg /tmp/.buildx-dbg

  publish-debug:
    needs: [build, debug]
    if: ${{ github.repository == 'gerbera/gerbera' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Download the debug image digests
        uses: actions/download-artifact@v8
        with:
          pattern: debug-digest-*
          merge-multiple: true

      - name: Publish the multi-platform debug image
        env:
          TAGS: ${{ needs.build.outputs.debug-tags }}
        run: |
          tags=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              tags+=(--tag "$tag")
            fi
          done <<< "$TAGS"
          test "${#tags[@]}" -gt 0
          read -r amd64_digest < debug-amd64.digest
          read -r arm64_digest < debug-arm64.digest
          docker buildx imagetools create "${tags[@]}" \
            "gerbera/gerbera@$amd64_digest" "gerbera/gerbera@$arm64_digest"
