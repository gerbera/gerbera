name: CI validation

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      execution-order:
        description: Build order (CodeQL remains independent)
        type: choice
        options: [repository-default, parallel, macos-first]
        default: repository-default
  schedule:
    - cron: '22 2 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'ci:complete-platforms' && format('-ignored-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event.action != 'labeled' }}

env:
  APK_TOOLS_URL: https://gitlab.alpinelinux.org/api/v4/projects/5/packages/generic/v2.14.10/x86_64/apk.static
  APK_TOOLS_SHA256: 34bb1a96f0258982377a289392d4ea9f3f4b767a4bb5806b1b87179b79ad8a1c
  APK_TOOLS_CDN_URL: https://dl-cdn.alpinelinux.org/alpine/v3.22/main/x86_64/apk-tools-static-2.14.12-r0.apk
  APK_TOOLS_CDN_PACKAGE_SHA256: f44523ae4ded143b3d85e16be4bf7ff386fc052406c3b22f87f045efb0aa4305
  APK_TOOLS_CDN_SHA256: 034d28bbf3d97d90fd76e572ab8ae74a038da0e7593e9d412eabccf69ccd3553

jobs:
  ignored-label:
    if: ${{ github.event.action == 'labeled' && github.event.label.name != 'ci:complete-platforms' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Record ignored label event
        run: echo 'This label does not request build or test coverage.'

  selection:
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'ci:complete-platforms' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      web: ${{ steps.select.outputs.web }}
      native: ${{ steps.select.outputs.native }}
      head: ${{ steps.select.outputs.head }}
      freebsd: ${{ steps.select.outputs.freebsd }}
      omnios: ${{ steps.select.outputs.omnios }}
      macos: ${{ steps.select.outputs.macos }}
      minimal: ${{ steps.select.outputs.minimal }}
      deb: ${{ steps.select.outputs.deb }}
      docker: ${{ steps.select.outputs.docker }}
      xml: ${{ steps.select.outputs.xml }}
      format_cpp: ${{ steps.select.outputs.format_cpp }}
      format_cmake: ${{ steps.select.outputs.format_cmake }}
      security: ${{ steps.select.outputs.security }}
      format: ${{ steps.select.outputs.format }}
      macos_first: ${{ steps.select.outputs.macos_first }}
      selection: ${{ steps.select.outputs.selection }}
      fingerprint: ${{ steps.select.outputs.fingerprint }}
      macos_run: ${{ steps.select.outputs.macos_run }}
      macos_first_run: ${{ steps.select.outputs.macos_first_run }}
      cpp_run: ${{ steps.select.outputs.cpp_run }}
      cpp_matrix: ${{ steps.select.outputs.cpp_matrix }}
      head_check_run: ${{ steps.select.outputs.head_check_run }}
      head_check_matrix: ${{ steps.select.outputs.head_check_matrix }}
      minimal_run: ${{ steps.select.outputs.minimal_run }}
      minimal_matrix: ${{ steps.select.outputs.minimal_matrix }}
      deb_package_run: ${{ steps.select.outputs.deb_package_run }}
      deb_package_matrix: ${{ steps.select.outputs.deb_package_matrix }}
      FreeBSD_run: ${{ steps.select.outputs.FreeBSD_run }}
      OmniOS_run: ${{ steps.select.outputs.OmniOS_run }}
      js_run: ${{ steps.select.outputs.js_run }}
      docker_build_run: ${{ steps.select.outputs.docker_build_run }}
      docker_debug_run: ${{ steps.select.outputs.docker_debug_run }}
      format_run: ${{ steps.select.outputs.format_run }}
      xml_run: ${{ steps.select.outputs.xml_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test coverage selection and completion gate
        run: python3 -B -m unittest discover -s test/ci -p 'test_*.py'
      - name: Select affected groups, platforms and missing coverage
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B .github/scripts/ci_selection.py

  macos-first:
    needs: [selection]
    if: ${{ needs.selection.result == 'success' && needs.selection.outputs.macos_run == 'true' && needs.selection.outputs.macos_first == 'true' }}
    name: macOS first
    runs-on: macos-latest
    steps: &macos_steps
      - uses: actions/checkout@v7
      - name: Install Deps
        run: |
          brew uninstall cmake; \
          brew install \
            cmake \
            pkg-config \
            duktape \
            exiv2 \
            fmt \
            ffmpeg \
            wavpack \
            ffmpegthumbnailer \
            googletest \
            libexif \
            libmagic \
            libmatroska \
            libupnp \
            ossp-uuid \
            ninja \
            pugixml \
            jsoncpp \
            icu4c \
            spdlog \
            taglib

      - name: Build
        run: |
          cmake -S . -G Ninja -B build --preset=macos
          cmake --build build -j$(sysctl -n hw.physicalcpu) --verbose

      - name: Test
        run: |
          cd build
          ctest --output-on-failure
      - name: Record platform completion [ci:${{ needs.selection.outputs.fingerprint }}:macos]
        if: ${{ success() }}
        shell: bash
        run: echo 'Selected build/test payload completed successfully.'

  macos:
    name: macOS
    runs-on: macos-latest
    needs: [selection]
    if: ${{ needs.selection.result == 'success' && needs.selection.outputs.macos_run == 'true' && needs.selection.outputs.macos_first == 'false' }}
    steps: *macos_steps

  cpp:
    needs: [selection, macos-first]
    if: ${{ always() && !cancelled() && needs.selection.result == 'success' && needs.selection.outputs.cpp_run == 'true' && (needs.selection.outputs.macos_first != 'true' || needs.selection.outputs.macos_run != 'true' || needs.macos-first.result == 'success') }}
    # ubuntu-latest is not latest....
    # until https://github.com/conan-io/conan-docker-tools/issues/205 is fixed:
    # libsqlite3.so: undefined reference to `fcntl64@GLIBC_2.28
    strategy:
      matrix: ${{ fromJSON(needs.selection.outputs.cpp_matrix) }}
    runs-on: ${{ matrix.compiler.system }}
    name: ${{ matrix.label }}
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
      CONAN_RUN_TESTS: 1
    steps:
      - uses: actions/checkout@v7
      # Alternatively: uses: docker://conanio/gcc9:latest
      - name: Update package list
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openssl
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install conan
        run: |
          pip install -U --no-cache-dir conan
          conan profile detect --name default
      - name: Cache conan dependencies
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan2-${{ matrix.compiler.name }}-${{ hashFiles('conanfile.py') }}-${{ hashFiles('conan/*') }}
          restore-keys: |
            - ${{ runner.os }}-conan2-${{ matrix.compiler.name }}-
      - name: build and test
        run: |
          # Remove existing package if it comes from the cache, otherwise
          # Conan will skip building it (due to --build=missing policy)
          conan remove 'gerbera/*' -c
          conan create -pr ./conan/dev -o='gerbera/*:icu=${{ matrix.compiler.icu }}' -o='gerbera/*:postgres=${{ matrix.compiler.pq }}' -o='gerbera/*:libsystemd=${{ matrix.compiler.systemd }}' --build=missing --version dev .
      - name: cleanup
        run: |
          # Remove build directories before creating a cache.
          conan remove '*' -c
      - name: Record platform completion [ci:${{ needs.selection.outputs.fingerprint }}:${{ matrix.target }}]
        if: ${{ success() }}
        shell: bash
        run: echo 'Selected build/test payload completed successfully.'

  head-check:
    needs: [selection, macos-first]
    if: ${{ always() && !cancelled() && needs.selection.result == 'success' && needs.selection.outputs.head_check_run == 'true' && (needs.selection.outputs.macos_first != 'true' || needs.selection.outputs.macos_run != 'true' || needs.macos-first.result == 'success') }}
    strategy:
      matrix: ${{ fromJSON(needs.selection.outputs.head_check_matrix) }}
    runs-on: ubuntu-latest
    name: ${{ matrix.label }}
    container:
      image: "ubuntu:26.04"
      env:
        DEBIAN_FRONTEND: noninteractive
        TZ: Etc/UTC
        GH_ACTIONS: y
    steps:
      - name: Install script pre-reqs
        shell: bash
        run: |
          ln -snf /usr/share/zoneinfo/$TZ /etc/localtime && echo $TZ > /etc/timezone
          apt-get update -y
          apt-get install -y lsb-release sudo wget curl git

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # We need history/tags to generate version info

      - name: Build and test
        run: |
          bash scripts/debian/build-deb.sh HEAD ${{ matrix.head.lib }}
      - name: Record platform completion [ci:${{ needs.selection.outputs.fingerprint }}:${{ matrix.target }}]
        if: ${{ success() }}
        shell: bash
        run: echo 'Selected build/test payload completed successfully.'

  FreeBSD:
    name: FreeBSD
    needs: [selection, macos-first]
    if: ${{ always() && !cancelled() && needs.selection.result == 'success' && needs.selection.outputs.FreeBSD_run == 'true' && (needs.selection.outputs.macos_first != 'true' || needs.selection.outputs.macos_run != 'true' || needs.macos-first.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/freebsd-vm@v1
        with:
          prepare: |
            pkg install -y cmake curl duktape duktape-lib googletest \
                exiv2 jsoncpp icu libexif ninja pkgconf \
                sqlite3 pugixml spdlog taglib upnp magic wavpack \
                ffmpeg ffmpegthumbnailer libmatroska libiconv libinotify \
                libzippp libzip
          run: |
            cmake -S . -B build -G Ninja --preset=develop \
                -DWITH_MYSQL=0 -DWITH_PGSQL=0 -DBUILD_DOC=0 -DBUILD_CHANGELOG=0
            cmake --build build -j$(nproc) --verbose
            cd build
            ctest --output-on-failure
            $GITHUB_WORKSPACE/build/gerbera --compile-info
      - name: Record platform completion [ci:${{ needs.selection.outputs.fingerprint }}:FreeBSD]
        if: ${{ success() }}
        shell: bash
        run: echo 'Selected build/test payload completed successfully.'

  OmniOS:
    name: OmniOS
    needs: [selection, macos-first]
    if: ${{ always() && !cancelled() && needs.selection.result == 'success' && needs.selection.outputs.OmniOS_run == 'true' && (needs.selection.outputs.macos_first != 'true' || needs.selection.outputs.macos_run != 'true' || needs.macos-first.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/omnios-vm@v1
        with:
          prepare: |
            pkg install bash cmake gnu-make icu4c curl ffmpeg gcc14 ninja \
                pkg-config sqlite-3 libexif gnu-coreutils \
                autoconf automake gnu-m4 libtool gnu-tar gzip bzip2
          run: |
            export GH_ACTIONS=y
            scripts/sunos/build-solaris.sh
            export LD_LIBRARY_PATH=/usr/local/lib:/opt/ooce/lib:/opt/ooce/lib/amd64:${LD_LIBRARY_PATH:-}
            ./build-solaris/gerbera --compile-info
      - name: Record platform completion [ci:${{ needs.selection.outputs.fingerprint }}:OmniOS]
        if: ${{ success() }}
        shell: bash
        run: echo 'Selected build/test payload completed successfully.'

  js:
    name: js
    needs: [selection, macos-first]
    if: ${{ always() && !cancelled() && needs.selection.result == 'success' && needs.selection.outputs.js_run == 'true' && (needs.selection.outputs.macos_first != 'true' || needs.selection.outputs.macos_run != 'true' || needs.macos-first.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DETECT_CHROMEDRIVER_VERSION: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: run tests
        run: |
          npm ci --legacy-peer-deps
          npm run lint
          npm run test:mock
          npm run test
          npm run test:e2e
        working-directory: ./gerbera-web
      - name: Upload browser failure diagnostics
        if: ${{ (failure()) }}
        uses: actions/upload-artifact@v7
        with:
          name: web-ui-failure-diagnostics
          path: gerbera-web/_build/e2e-failures/
          if-no-files-found: ignore
      - name: Record platform completion [ci:${{ needs.selection.outputs.fingerprint }}:js]
        if: ${{ success() }}
        shell: bash
        run: echo 'Selected build/test payload completed successfully.'

  minimal:
    needs: [selection, macos-first]
    if: ${{ always() && !cancelled() && needs.selection.result == 'success' && needs.selection.outputs.minimal_run == 'true' && (needs.selection.outputs.macos_first != 'true' || needs.selection.outputs.macos_run != 'true' || needs.macos-first.result == 'success') }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.selection.outputs.minimal_matrix) }}
    name: ${{ matrix.label }}
    defaults:
      run:
        shell: alpine.sh {0}
    steps:
      - uses: actions/checkout@v7
      - name: Download and verify static apk-tools
        id: apk-tools
        shell: bash
        timeout-minutes: 6
        run: |
          # setup-alpine verifies and reuses this file instead of downloading it again.
          apk_download="$RUNNER_TEMP/apk.download"
          apk_extracted="$RUNNER_TEMP/apk.extracted"
          trap 'rm -f -- "$apk_download" "$apk_extracted"' EXIT
          download() {
            curl --ipv4 --fail --show-error --location \
              --connect-timeout 10 --max-time 30 \
              --retry 2 --retry-delay 5 --retry-max-time 60 --retry-connrefused \
              --output "$apk_download" "$1"
          }
          apk_sha256="$APK_TOOLS_SHA256"
          if download "$APK_TOOLS_CDN_URL"; then
            printf '%s  %s\n' "$APK_TOOLS_CDN_PACKAGE_SHA256" "$apk_download" | sha256sum --check --strict
            tar --ignore-zeros -xzOf "$apk_download" sbin/apk.static > "$apk_extracted"
            mv -- "$apk_extracted" "$apk_download"
            apk_sha256="$APK_TOOLS_CDN_SHA256"
          else
            echo '::warning::Alpine CDN download failed; using the pinned Alpine GitLab binary.'
            download "$APK_TOOLS_URL"
          fi
          printf '%s  %s\n' "$apk_sha256" "$apk_download" | sha256sum --check --strict
          mv -- "$apk_download" "$RUNNER_TEMP/apk"
          # setup-alpine must reuse the preloaded binary with the selected hash.
          printf 'sha256=%s\n' "$apk_sha256" >> "$GITHUB_OUTPUT"
      - name: Test Alpine mirror selection
        if: matrix.platform == 'x86' && matrix.branch == 'edge'
        shell: bash
        timeout-minutes: 2
        run: python3 .github/scripts/test_select_alpine_mirror.py
      - name: Select Alpine package mirror
        id: alpine-mirror
        shell: bash
        timeout-minutes: 8
        env:
          ALPINE_BRANCH: ${{ matrix.branch }}
          ALPINE_ARCH: ${{ matrix.platform }}
        run: bash .github/scripts/select-alpine-mirror.sh "$ALPINE_BRANCH" "$ALPINE_ARCH" >> "$GITHUB_OUTPUT"
      - uses: jirutka/setup-alpine@v1
        with:
          mirror-url: ${{ steps.alpine-mirror.outputs.mirror-url }}
          extra-repositories: ${{ steps.alpine-mirror.outputs.extra-repositories }}
          apk-tools-url: '${{ env.APK_TOOLS_URL }}#!sha256!${{ steps.apk-tools.outputs.sha256 }}'
          branch: ${{matrix.branch}}
          arch: ${{matrix.platform}}
          packages: >
            build-base
            cmake
            duktape-dev
            fmt-dev
            git
            gtest-dev
            libupnp-dev
            ninja
            pkgconf
            pugixml-dev
            jsoncpp-dev
            spdlog-dev
            sqlite-dev
            icu-dev
            util-linux-dev
            zlib-dev

      - name: Build
        run: |
          cmake -S . -B build -G Ninja --preset=minimal
          cmake --build build -j$(nproc) --verbose

      - name: Test
        run: |
          cd build
          ctest --output-on-failure
      - name: Record platform completion [ci:${{ needs.selection.outputs.fingerprint }}:${{ matrix.target }}]
        if: ${{ success() }}
        shell: bash
        run: echo 'Selected build/test payload completed successfully.'

  deb-package:
    needs: [selection, macos-first]
    if: ${{ always() && !cancelled() && needs.selection.result == 'success' && needs.selection.outputs.deb_package_run == 'true' && (needs.selection.outputs.macos_first != 'true' || needs.selection.outputs.macos_run != 'true' || needs.macos-first.result == 'success') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.selection.outputs.deb_package_matrix) }}
    runs-on: ${{ matrix.runner }}
    name: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # We need history/tags to generate version info

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build and upload deb
        env:
          DEB_UPLOAD_ACCESS_KEY_ID: ${{ secrets.DEB_UPLOAD_ACCESS_KEY_ID }}
          DEB_UPLOAD_ENDPOINT: ${{ secrets.DEB_UPLOAD_ENDPOINT }}
          DEB_UPLOAD_SECRET_ACCESS_KEY: ${{ secrets.DEB_UPLOAD_SECRET_ACCESS_KEY }}
          PKG_SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
          PKG_SIGNING_KEY_ID: ${{ secrets.PKG_SIGNING_KEY_ID }}
        run: |
          docker run \
            --platform=${{ matrix.arch }} \
            -e TZ=Etc/UTC \
            -e DEB_UPLOAD_ACCESS_KEY_ID \
            -e DEB_UPLOAD_SECRET_ACCESS_KEY \
            -e PKG_SIGNING_KEY \
            -e PKG_SIGNING_KEY_ID \
            -e DEB_UPLOAD_ENDPOINT \
            -e GH_ACTIONS=y \
            -e GH_EVENT="${{ github.event_name }}" \
            -v "$(pwd):/build" \
            -w /build \
          ${{ matrix.os-ver }} \
          bash /build/scripts/debian/build-deb.sh ${{ matrix.os-ver }} ${{ matrix.arch }}

      - uses: frabert/replace-string-action@v2.5.2
        if: ${{ (github.event_name != 'pull_request') }}
        id: replace
        with:
          pattern: '(\w+):([\w\.]+):linux/(\w+)(?:/(\w+))?'
          string: '${{ matrix.os-ver }}:${{ matrix.arch }}'
          replace-with: $1-$2-$3$4.deb

      - uses: actions/upload-artifact@v7
        if: ${{ (github.event_name != 'pull_request') }}
        with:
          name: ${{ steps.replace.outputs.replaced }}
          path: build-deb/*.deb
      - name: Record platform completion [ci:${{ needs.selection.outputs.fingerprint }}:${{ matrix.target }}]
        if: ${{ success() }}
        shell: bash
        run: echo 'Selected build/test payload completed successfully.'

  docker-build:
    name: Docker image
    needs: [selection, macos-first]
    if: ${{ always() && !cancelled() && needs.selection.result == 'success' && needs.selection.outputs.docker_build_run == 'true' && (needs.selection.outputs.macos_first != 'true' || needs.selection.outputs.macos_run != 'true' || needs.macos-first.result == 'success') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # We need history/tags to generate version info

      - name: Docker meta
        id: docker_meta
        uses: docker/metadata-action@v6
        with:
          images: gerbera/gerbera
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=edge

      - name: Docker meta (transcoding)
        id: docker_meta_transcoding
        uses: docker/metadata-action@v6
        with:
          images: gerbera/gerbera
          flavor: |
            suffix=-transcoding
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=edge

      - name: Set up QEMU
        if: ${{ (github.repository == 'gerbera/gerbera' && ( startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' )) }}
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: ${{ (github.repository == 'gerbera/gerbera' && ( startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' )) }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

        # https://docs.docker.com/build/ci/github-actions/test-before-push/
      - name: Build and export
        if: ${{ (github.event_name == 'pull_request') }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: ${{ steps.docker_meta.outputs.tags }}-test
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Test
        if: ${{ (github.event_name == 'pull_request') }}
        run: |
          docker run --user gerbera:gerbera --rm ${{ steps.docker_meta.outputs.tags }}-test gerbera --compile-info

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: "linux/amd64${{ ( startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' ) && ',linux/arm/v7,linux/arm64' || '' }}"
          push: ${{ github.repository == 'gerbera/gerbera' && ( startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' ) }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Build and push (transcoding)
        if: ${{ (github.repository == 'gerbera/gerbera' && ( startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' )) }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: ${{ github.repository == 'gerbera/gerbera' && ( startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' ) }}
          tags: ${{ steps.docker_meta_transcoding.outputs.tags }}
          labels: ${{ steps.docker_meta_transcoding.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          target: with_transcoding

      - # Temp fix
        # https://github.com/docker/build-push-action/issues/252
        # https://github.com/moby/buildkit/issues/1896
        name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Docker Hub Description
        if: ${{ (github.repository == 'gerbera/gerbera' && ( startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' )) }}
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          repository: gerbera/gerbera
          readme-filepath: README.Docker.md
      - name: Record platform completion [ci:${{ needs.selection.outputs.fingerprint }}:docker-build]
        if: ${{ success() }}
        shell: bash
        run: echo 'Selected build/test payload completed successfully.'

  docker-debug:
    name: Docker debug image
    needs: [selection, macos-first, docker-build]
    if: ${{ always() && !cancelled() && needs.selection.result == 'success' && needs.selection.outputs.docker_debug_run == 'true' && (needs.selection.outputs.macos_first != 'true' || needs.selection.outputs.macos_run != 'true' || needs.macos-first.result == 'success') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # We need history/tags to generate version info

      - name: Docker meta (debug)
        id: docker_meta_debug
        uses: docker/metadata-action@v6
        with:
          images: gerbera/gerbera
          flavor: |
            suffix=-debug
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=edge

      - name: Set up QEMU
        if: ${{ (github.repository == 'gerbera/gerbera' && ( startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' )) }}
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        if: ${{ (github.repository == 'gerbera/gerbera' && ( startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' )) }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Cache Docker layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-dbg
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Build and export (debug)
        if: ${{ (github.event_name == 'pull_request') }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.debug
          platforms: "linux/amd64"
          load: true
          tags: ${{ steps.docker_meta_debug.outputs.tags }}-test
          labels: ${{ steps.docker_meta_debug.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-dbg
          cache-to: type=local,dest=/tmp/.buildx-cache-dbg,mode=max
          target: debug

      - name: Test (debug)
        if: ${{ (github.event_name == 'pull_request') }}
        run: |
          docker run --user gerbera:gerbera --rm ${{ steps.docker_meta_debug.outputs.tags }}-test gerbera --compile-info

      - name: Build and push (debug)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.debug
          platforms: "linux/amd64${{ ( startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' ) && ',linux/arm/v7,linux/arm64' || '' }}"
          push: ${{ github.repository == 'gerbera/gerbera' && ( startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/master' ) }}
          tags: ${{ steps.docker_meta_debug.outputs.tags }}
          labels: ${{ steps.docker_meta_debug.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-dbg
          cache-to: type=local,dest=/tmp/.buildx-cache-dbg,mode=max
          target: debug

      - # Temp fix
        # https://github.com/docker/build-push-action/issues/252
        # https://github.com/moby/buildkit/issues/1896
        name: Move cache
        run: |
          rm -rf /tmp/.buildx-dbg
          mv /tmp/.buildx-cache-dbg /tmp/.buildx-dbg
      - name: Record platform completion [ci:${{ needs.selection.outputs.fingerprint }}:docker-debug]
        if: ${{ success() }}
        shell: bash
        run: echo 'Selected build/test payload completed successfully.'

  format:
    name: Formatting
    runs-on: ubuntu-latest
    needs: [selection]
    if: ${{ always() && !cancelled() && needs.selection.result == 'success' && needs.selection.outputs.format_run == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - name: Check C++ formatting
        if: needs.selection.outputs.format_cpp == 'true'
        uses: DoozyX/clang-format-lint-action@v0.20
        with:
          source: './src'
          exclude: './src/contrib'
          extensions: 'h,cc'
          clangFormatVersion: 18
      - name: Install CMake formatter
        if: needs.selection.outputs.format_cmake == 'true'
        run: pip install cmakelang
      - name: Check selected CMake files together
        if: needs.selection.outputs.format_cmake == 'true'
        env:
          SELECTION_JSON: ${{ needs.selection.outputs.selection }}
        run: python3 -B .github/scripts/ci_selection.py --format-cmake
      - name: Record platform completion [ci:${{ needs.selection.outputs.fingerprint }}:format]
        if: ${{ success() }}
        shell: bash
        run: echo 'Selected build/test payload completed successfully.'

  xml:
    name: Validate XSD schemas
    runs-on: ubuntu-latest
    needs: [selection, macos-first]
    if: ${{ always() && !cancelled() && needs.selection.result == 'success' && needs.selection.outputs.xml_run == 'true' && (needs.selection.outputs.macos_first != 'true' || needs.selection.outputs.macos_run != 'true' || needs.macos-first.result == 'success') }}
    steps:
      - name: Checkout Gerbera code
        uses: actions/checkout@v7
      - name: Enable validation annotations
        uses: korelstar/xmllint-problem-matcher@v1
      - name: Validate mock-config-all-os.xml
        uses: ChristophWurst/xmllint-action@v1
        with:
          xml-file: ./test/config/fixtures/mock-config-all-os.xml
          xml-schema-file: ./config/config2.xsd
      - name: Validate mock-config-all.xml
        uses: ChristophWurst/xmllint-action@v1
        with:
          xml-file: ./test/config/fixtures/mock-config-all.xml
          xml-schema-file: ./config/config2.xsd
      - name: Validate mock-example-exiv2-all-os.xml
        uses: ChristophWurst/xmllint-action@v1
        with:
          xml-file: ./test/config/fixtures/mock-example-exiv2-all-os.xml
          xml-schema-file: ./config/config2.xsd
      - name: Validate mock-example-exiv2-all.xml
        uses: ChristophWurst/xmllint-action@v1
        with:
          xml-file: ./test/config/fixtures/mock-example-exiv2-all.xml
          xml-schema-file: ./config/config2.xsd
      - name: Validate mock-example-lastfm-all-os.xml
        uses: ChristophWurst/xmllint-action@v1
        with:
          xml-file: ./test/config/fixtures/mock-example-lastfm-all-os.xml
          xml-schema-file: ./config/config2.xsd
      - name: Validate mock-example-lastfm-all.xml
        uses: ChristophWurst/xmllint-action@v1
        with:
          xml-file: ./test/config/fixtures/mock-example-lastfm-all.xml
          xml-schema-file: ./config/config2.xsd
      - name: Validate mock-example-all-os.xml
        uses: ChristophWurst/xmllint-action@v1
        with:
          xml-file: ./test/config/fixtures/mock-example-all-os.xml
          xml-schema-file: ./config/config2.xsd
      - name: Validate mock-example-all.xml
        uses: ChristophWurst/xmllint-action@v1
        with:
          xml-file: ./test/config/fixtures/mock-example-all.xml
          xml-schema-file: ./config/config2.xsd
      - name: Validate full-example-for-xsd.xml
        uses: ChristophWurst/xmllint-action@v1
        with:
          xml-file: ./test/config/fixtures/full-example-for-xsd.xml
          xml-schema-file: ./config/config2.xsd

      - name: Record platform completion [ci:${{ needs.selection.outputs.fingerprint }}:xml]
        if: ${{ success() }}
        shell: bash
        run: echo 'Selected build/test payload completed successfully.'

  # Retain the required "lint" context as the completion/formatting gate.
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    needs: [selection, macos-first, macos, cpp, head-check, FreeBSD, OmniOS, js, minimal, deb-package, docker-build, docker-debug, format, xml]
    if: ${{ always() && (github.event.action != 'labeled' || github.event.label.name == 'ci:complete-platforms') }}
    steps:
      - uses: actions/checkout@v7
        if: ${{ always() }}
        with:
          persist-credentials: false
      - name: Verify every selected group and formatting result
        if: ${{ always() }}
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 -B .github/scripts/ci_selection.py --final-result
