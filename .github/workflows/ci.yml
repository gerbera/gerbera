name: CI validation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    # ubuntu-latest is not latest....
    # until https://github.com/conan-io/conan-docker-tools/issues/205 is fixed:
    # libsqlite3.so: undefined reference to `fcntl64@GLIBC_2.28
    strategy:
      matrix:
        compiler:
          - name: gcc
            cc: gcc-10
            cxx: g++-10
            icu: "False"
            pq: "False"
            systemd: "True"
            system: ubuntu-22.04
          - name: clang
            cc: clang-13
            cxx: clang++-13
            icu: "True"
            pq: "False"
            systemd: "True"
            system: ubuntu-22.04
          - name: gcc-13
            cc: gcc-13
            cxx: g++-13
            icu: "False"
            pq: "False"
            systemd: "True"
            system: ubuntu-24.04
          - name: clang-18
            cc: clang-18
            cxx: clang++-18
            icu: "True"
            pq: "False"
            systemd: "True"
            system: ubuntu-24.04
          - name: gcc-15
            cc: gcc-15
            cxx: g++-15
            icu: "False"
            pq: "False"
            systemd: "False"
            system: ubuntu-26.04
          - name: clang-21
            cc: clang-21
            cxx: clang++-21
            icu: "True"
            pq: "False"
            systemd: "False"
            system: ubuntu-26.04
    runs-on: ${{ matrix.compiler.system }}
    name: Compile ${{ matrix.compiler.name }}
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
      CONAN_RUN_TESTS: 1
    steps:
      - uses: actions/checkout@v7
      # Alternatively: uses: docker://conanio/gcc9:latest
      - name: Update package list
        run: |
          sudo bash .github/scripts/ubuntu-apt-mirrors.sh
          sudo apt-get update -y
          sudo apt-get install -y openssl
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install conan
        run: |
          pip install -U --no-cache-dir conan
          conan profile detect --name default
      - name: Cache conan dependencies
        uses: actions/cache@v6
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan2-${{ matrix.compiler.name }}-${{ hashFiles('conanfile.py') }}-${{ hashFiles('conan/*') }}
          restore-keys: |
            - ${{ runner.os }}-conan2-${{ matrix.compiler.name }}-
      - name: build and test
        run: |
          # Remove existing package if it comes from the cache, otherwise
          # Conan will skip building it (due to --build=missing policy)
          conan remove 'gerbera/*' -c
          conan create -pr ./conan/dev -o='gerbera/*:icu=${{ matrix.compiler.icu }}' -o='gerbera/*:postgres=${{ matrix.compiler.pq }}' -o='gerbera/*:libsystemd=${{ matrix.compiler.systemd }}' --build=missing --version dev .
      - name: cleanup
        run: |
          # Remove build directories before creating a cache.
          conan remove '*' -c

  head-check:
    strategy:
      matrix:
        head:
          - name: check
            lib: pupnp
          - name: npupnp
            lib: npupnp
    runs-on: ubuntu-latest
    name: head-${{ matrix.head.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # We need history/tags to generate version info

      - name: Build and test
        run: |
          docker run --rm -e TZ=Etc/UTC -e GH_ACTIONS=y -v "$PWD:/build" -w /build \
            ubuntu:26.04 bash scripts/debian/build-deb.sh HEAD ${{ matrix.head.lib }}

  FreeBSD:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: vmactions/freebsd-vm@v1
        with:
          prepare: |
            pkg install -y cmake curl duktape duktape-lib googletest \
                exiv2 jsoncpp icu libexif ninja pkgconf \
                sqlite3 pugixml spdlog taglib upnp magic wavpack \
                ffmpeg ffmpegthumbnailer libmatroska libiconv libinotify \
                libzippp libzip
          run: |
            cmake -S . -B build -G Ninja --preset=develop \
                -DWITH_MYSQL=0 -DWITH_PGSQL=0 -DBUILD_DOC=0 -DBUILD_CHANGELOG=0
            cmake --build build -j$(nproc) --verbose
            cd build
            ctest --output-on-failure
            $GITHUB_WORKSPACE/build/gerbera --compile-info

  OmniOS:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stage verified OmniOS package archives
        continue-on-error: true
        run: |
          archive_dir=$(mktemp -d "$RUNNER_TEMP/omnios-ips.XXXXXX")
          trap 'rm -f -- "$archive_dir/core.p5p" "$archive_dir/extra.p5p"; rmdir -- "$archive_dir"' EXIT
          release_url=https://github.com/atomvincent01/gerbera/releases/download/ci-omnios-r151060-20261111
          for archive in core.p5p extra.p5p; do
            curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location \
              --connect-timeout 10 --max-time 180 --retry 2 --retry-all-errors --retry-max-time 240 \
              --output "$archive_dir/$archive" "$release_url/$archive"
          done
          (
            cd "$archive_dir"
            sha256sum --check --strict <<'SHA256'
          a82062396b590c4246235d5ba96c86e0d89bc0dfefaab8811b96ef4437eced4b  core.p5p
          252543385be22804515c91f0b277336c9f8dc2f1fe2db9df57e053251726e1b1  extra.p5p
          SHA256
          )
          mv -T -- "$archive_dir" "$GITHUB_WORKSPACE/.omnios-ips"
          trap - EXIT
      - uses: vmactions/omnios-vm@aeee92416495d9685b2997d954f6b063ae5b832d # v1
        with:
          release: r151060-build
          copyback: false
          prepare: |
            set -eu
            export PKG_SUCCESS_ON_NOP=1
            set -- sudo git bash cmake gnu-make icu4c curl ffmpeg gcc14 ninja \
              pkg-config sqlite-3 libexif gnu-coreutils autoconf automake gnu-m4 libtool gnu-tar gzip bzip2
            if pkg install "$@"; then
              exit 0
            fi

            core="$PWD/.omnios-ips/core.p5p"
            extra="$PWD/.omnios-ips/extra.p5p"
            if [ ! -s "$core" ] || [ ! -s "$extra" ]; then
              echo 'OmniOS package installation failed and verified fallback archives are unavailable.' >&2
              exit 1
            fi
            echo 'OmniOS package installation failed. Using the verified local IPS archives.'
            # Keep the signed publishers and use the local catalogs for later pkg commands too.
            pkg set-publisher -M '*' -O "$core" omnios
            pkg set-publisher -M '*' -O "$extra" extra.omnios
            pkg install --no-refresh "$@"
          run: |
            export GH_ACTIONS=y PKG_SUCCESS_ON_NOP=1
            scripts/sunos/build-solaris.sh
            export LD_LIBRARY_PATH=/usr/local/lib:/opt/ooce/lib:/opt/ooce/lib/amd64:${LD_LIBRARY_PATH:-}
            ./build-solaris/gerbera --compile-info
